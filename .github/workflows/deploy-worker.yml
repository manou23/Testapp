name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Cloudflare credentials and KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_KV_NAMESPACE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          if ! [[ "$CLOUDFLARE_KV_NAMESPACE_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_KV_NAMESPACE_ID must be a 32-character KV namespace ID."
            exit 1
          fi
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$CLOUDFLARE_KV_NAMESPACE_ID/" backend/wrangler.toml

      - name: Deploy Worker
        id: deploy
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.36.0 deploy 2>&1 | tee "$RUNNER_TEMP/wrangler-deploy.log"
          WORKER_URL="$(grep -Eo 'https://mesut-ai-studio-api\.[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/wrangler-deploy.log" | tail -n 1 || true)"
          if [ -z "$WORKER_URL" ]; then
            echo "::error::Could not detect the deployed workers.dev URL. Check whether workers.dev is enabled for this Cloudflare account."
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Save backend URL for Android builds
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          gh variable set BACKEND_URL --body "$WORKER_URL" --repo "$GITHUB_REPOSITORY"
          echo "Saved BACKEND_URL=$WORKER_URL"

      - name: Trigger Android build with the deployed backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main --repo "$GITHUB_REPOSITORY"
