name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "backend/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Deployed HTTPS Cloudflare Worker URL (normally supplied by the deploy workflow)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mesut-ai-studio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Cloudflare Worker
        working-directory: backend
        run: npm test

  android:
    needs: worker-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run Android unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Validate deployed backend URL
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || vars.BACKEND_URL || 'https://mesut-ai-studio-api.mesut-amari23.workers.dev' }}
        run: |
          set -euo pipefail
          if [ -z "$BACKEND_URL" ] || ! [[ "$BACKEND_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Deploy the Cloudflare Worker first. BACKEND_URL must be a valid HTTPS workers.dev URL."
            exit 1
          fi

      - name: Build debug APK
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || vars.BACKEND_URL || 'https://mesut-ai-studio-api.mesut-amari23.workers.dev' }}
        run: gradle --no-daemon assembleDebug -PbackendUrl="$BACKEND_URL"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mesut-AI-Studio-1.0.2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check release signing configuration
        id: release_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release APK skipped: add the four ANDROID_KEYSTORE_* GitHub Actions secrets to enable stable signed updates."
          fi

      - name: Prepare persistent release keystore
        if: steps.release_signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mesut-release.jks"
          test -s "$RUNNER_TEMP/mesut-release.jks"

      - name: Build signed release APK
        if: steps.release_signing.outputs.available == 'true'
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || vars.BACKEND_URL || 'https://mesut-ai-studio-api.mesut-amari23.workers.dev' }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mesut-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease -PbackendUrl="$BACKEND_URL"

      - name: Upload signed release APK
        if: steps.release_signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mesut-AI-Studio-${{ github.ref_name }}-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
