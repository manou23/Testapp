name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "backend/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Cloudflare Worker
        working-directory: backend
        run: npm test

  android:
    needs: worker-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug -PbackendUrl="${{ vars.BACKEND_URL }}"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mesut-AI-Studio-1.0.2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
