name = "mesut-ai-studio-api"
main = "src/index.js"
compatibility_date = "2026-11-09"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "LIMITS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[ratelimits]]
name = "DEVICE_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 12
period = 60

[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1002"

[ratelimits.simple]
limit = 60
period = 60

[vars]
DAILY_FREE_LIMIT = "3"
